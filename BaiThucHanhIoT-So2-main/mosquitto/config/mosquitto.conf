# Cấu hình Mosquitto cho bài thực hành (không bảo mật — chỉ dùng trong LAN lab)
# Môi trường thật nên bật TLS + password_file. Xem phần "Mở rộng" trong README.

listener 1883
protocol mqtt

listener 9001
protocol websockets

allow_anonymous true

persistence true
persistence_location /mosquitto/data/

log_dest file /mosquitto/log/mosquitto.log
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp true

# Giới hạn hợp lý cho lab
max_packet_size 65536
max_queued_messages 1000
